spring:
  application:
    name: technician-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/technician_db?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:technician_db_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: ${SERVER_PORT:8092}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
